[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refusallens"
version = "0.1.0"
description = "Counterfactual explanations for why language models refuse — find the minimal edit that flips refusal ↔ compliance."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "RefusalLens Team"},
]
keywords = [
    "explainable-ai",
    "llm-safety",
    "refusal-behavior",
    "counterfactual-explanations",
    "ai-alignment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    "gradio>=4.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]
full = [
    "datasets>=2.14.0",
    "nltk>=3.8.0",
    "sentence-transformers>=2.2.0",
    "bitsandbytes>=0.41.0",
]

[project.urls]
Homepage = "https://github.com/refusallens/refusallens"
Repository = "https://github.com/refusallens/refusallens"

[tool.setuptools.packages.find]
include = ["refusallens*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
